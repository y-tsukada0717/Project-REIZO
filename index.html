<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REIZO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script>

<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f6f6;color:#222}
main{max-width:520px;margin:auto;padding:20px}
h1{margin-bottom:4px}h2{margin-top:8px}
.sub{color:#666;margin-top:0}
.card,.item{background:#fff;padding:16px;border-radius:14px;margin-bottom:16px}
.item{padding:14px;margin-bottom:10px}
input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;font-size:16px}
button{cursor:pointer}
.primary,.scan-button{font-weight:700;padding:14px}
.scan-button{font-size:18px;padding:15px}
.row,.status-buttons{display:flex;gap:8px}
.row>*{flex:1}
.status-buttons button{padding:8px;font-size:14px}
.item-name{font-weight:700;margin-bottom:8px}
.item-meta,.scan-help,.receipt-help{color:#777;font-size:13px;margin-bottom:8px}
.active{font-weight:bold;outline:2px solid #222}
.danger{margin-top:8px;font-size:13px}
#message{margin:12px 0;font-weight:600;min-height:20px}
.success{padding:10px;background:#eef8ee;border-radius:8px}
.error{padding:10px;background:#fff0f0;border-radius:8px}
.hidden{display:none!important}
.invite{font-family:monospace;font-size:18px;word-break:break-all}
.jan-number{font-family:monospace;font-size:18px;font-weight:700;word-break:break-all}
.badge{display:inline-block;font-size:12px;padding:3px 7px;border-radius:10px;background:#eee;margin-left:5px}
#reader{width:100%;margin-top:12px;overflow:hidden;border-radius:12px}
hr{margin:22px 0;border:0;border-top:1px solid #ddd}
.receipt-preview{display:block;max-width:100%;max-height:420px;margin:12px auto 0;border-radius:10px}
.ocr-progress-wrap{margin-top:12px}
.ocr-progress-bar{height:10px;background:#e5e5e5;border-radius:999px;overflow:hidden}
.ocr-progress-fill{height:100%;width:0%;background:#555;transition:width .15s}
.ocr-status{font-size:13px;color:#666;margin-top:6px}
.ocr-result{min-height:220px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.5}
.section-tag{font-size:12px;color:#666;font-weight:600}
.warning-note{font-size:13px;background:#fff8e6;padding:10px;border-radius:8px;margin-top:10px}
</style>
</head>

<body>
<main>

<h1>REIZO</h1>
<p class="sub">わが家の共有冷蔵庫</p>
<div id="message"></div>

<section id="authView" class="card hidden">
<h2>ログイン</h2>
<input id="email" type="email" placeholder="メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<div class="row">
<button onclick="signIn()">ログイン</button>
<button onclick="signUp()">新規登録</button>
</div>
</section>

<section id="householdView" class="card hidden">
<h2>家を設定</h2>
<p>新しく家を作る</p>
<input id="houseName" placeholder="例：わが家">
<button onclick="createHousehold()">家を作る</button>

<hr>

<p>招待コードで参加</p>
<input id="inviteInput" placeholder="招待コード">
<button onclick="joinHousehold()">参加する</button>
<button onclick="signOut()">ログアウト</button>
</section>

<section id="appView" class="hidden">

<div class="card">
<h2 id="householdName">わが家</h2>
<p>招待コード</p>
<div id="inviteCode" class="invite"></div>
<button onclick="signOut()">ログアウト</button>
</div>

<div class="card">
<div class="section-tag">JAN入庫</div>
<h2>商品を入庫</h2>
<button class="scan-button" onclick="startScanner()">📷 JANをスキャン</button>
<p class="scan-help">商品のバーコードをカメラに映してください。</p>
<div id="scannerArea" class="hidden">
<div id="reader"></div>
<button onclick="stopScanner()">スキャンを閉じる</button>
</div>
</div>

<div id="unknownProductView" class="card hidden">
<h2>初めての商品</h2>
<p>このJANはまだ登録されていません。</p>
<p>JAN</p>
<div id="scannedJan" class="jan-number"></div>
<input id="newProductName" placeholder="商品名 例：明治おいしい牛乳 900ml">

<select id="newProductStorage">
<option value="fridge">冷蔵</option>
<option value="freezer">冷凍</option>
<option value="pantry">常温</option>
</select>

<button class="primary" onclick="saveNewProduct()">記憶して入庫</button>
<button onclick="cancelUnknownProduct()">キャンセル</button>
</div>

<div class="card">
<div class="section-tag">v0.3 OCRテスト</div>
<h2>🧾 レシートを読む</h2>

<p class="receipt-help">
この段階では読み取った文字を表示するだけです。在庫は変更しません。
</p>

<input
  id="receiptFile"
  type="file"
  accept="image/*"
  capture="environment"
  onchange="receiptFileChanged()"
>

<img
  id="receiptPreview"
  class="receipt-preview hidden"
  alt="レシート画像プレビュー"
>

<button id="ocrButton" class="primary" onclick="runReceiptOcr()">
文字を読み取る
</button>

<div id="ocrProgressWrap" class="ocr-progress-wrap hidden">
<div class="ocr-progress-bar">
<div id="ocrProgressFill" class="ocr-progress-fill"></div>
</div>
<div id="ocrStatus" class="ocr-status">準備中…</div>
</div>

<div id="ocrResultArea" class="hidden">
<p><strong>OCR認識結果</strong></p>
<textarea id="ocrResult" class="ocr-result" readonly></textarea>
<button onclick="clearReceiptOcr()">結果をクリア</button>
</div>

<div class="warning-note">
まずは実際のレシートと認識結果を見比べて、商品名・価格・店名がどの程度読めるか確認します。
</div>
</div>

<div class="card">
<h2>手動で追加</h2>
<input id="itemName" placeholder="例：キャベツ">

<select id="storage">
<option value="fridge">冷蔵</option>
<option value="freezer">冷凍</option>
<option value="pantry">常温</option>
</select>

<button onclick="addItem()">追加</button>
</div>

<h2>在庫</h2>
<div id="items"></div>

<h2>買い物候補</h2>
<div id="shopping"></div>

</section>
</main>

<script>

/* =========================================
   ★ここだけ、今使っている自分の値に変更
   ========================================= */

const SUPABASE_URL =
  "https://faavfjrkdgnufhpqjkks.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YNdPWnNeuENGqHlUO1iwCQ_pdbaqpe9";

/* ========================================= */

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentHousehold = null;
let realtimeChannel = null;

let html5QrCode = null;
let scannerRunning = false;
let scanLock = false;
let pendingJan = null;

let ocrWorker = null;
let receiptPreviewUrl = null;


/* ===============================
   共通
   =============================== */

function show(id) {
  [
    "authView",
    "householdView",
    "appView"
  ].forEach(x =>
    document
      .getElementById(x)
      .classList
      .add("hidden")
  );

  document
    .getElementById(id)
    .classList
    .remove("hidden");
}

function message(text, type = "") {
  const el =
    document.getElementById("message");

  el.textContent = text || "";
  el.className = "";

  if (type) {
    el.classList.add(type);
  }
}

function escapeHtml(text) {
  const d =
    document.createElement("div");

  d.textContent = text;

  return d.innerHTML;
}


/* ===============================
   ログイン
   =============================== */

async function signUp() {

  message("");

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const { data, error } =
    await db.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo:
          location.origin +
          location.pathname
      }
    });

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  if (data.session) {

    message(
      "登録しました",
      "success"
    );

    await boot();

  } else {

    message(
      "確認メールを送信しました。メール内のリンクを開いてください。",
      "success"
    );
  }
}

async function signIn() {

  message("");

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const { error } =
    await db.auth
      .signInWithPassword({
        email,
        password
      });

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  await boot();
}

async function signOut() {

  await stopScanner();

  if (realtimeChannel) {
    await db.removeChannel(
      realtimeChannel
    );

    realtimeChannel = null;
  }

  currentHousehold = null;

  await db.auth.signOut();

  message("");

  show("authView");
}


/* ===============================
   起動
   =============================== */

async function boot() {

  const { data } =
    await db.auth.getSession();

  if (!data.session) {
    return show("authView");
  }

  const {
    data: membership,
    error
  } =
    await db
      .from("household_members")
      .select("household_id")
      .limit(1)
      .maybeSingle();

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  if (!membership) {
    return show(
      "householdView"
    );
  }

  await openHousehold(
    membership.household_id
  );
}


/* ===============================
   家
   =============================== */

async function createHousehold() {

  const name =
    document
      .getElementById("houseName")
      .value
      .trim();

  if (!name) {
    return message(
      "家の名前を入力してください",
      "error"
    );
  }

  const { data, error } =
    await db.rpc(
      "create_household",
      {
        p_name: name
      }
    );

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  await openHousehold(
    data[0].household_id
  );
}

async function joinHousehold() {

  const code =
    document
      .getElementById("inviteInput")
      .value
      .trim();

  if (!code) {
    return message(
      "招待コードを入力してください",
      "error"
    );
  }

  const { data, error } =
    await db.rpc(
      "join_household",
      {
        p_invite_code: code
      }
    );

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  await openHousehold(data);
}

async function openHousehold(id) {

  const { data, error } =
    await db
      .from("households")
      .select(
        "id,name,invite_code"
      )
      .eq("id", id)
      .single();

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  currentHousehold = data;

  document
    .getElementById(
      "householdName"
    )
    .textContent =
      data.name;

  document
    .getElementById(
      "inviteCode"
    )
    .textContent =
      data.invite_code;

  show("appView");

  await loadItems();

  startRealtime();
}


/* ===============================
   JANスキャナー
   =============================== */

async function startScanner() {

  message("");

  scanLock = false;

  document
    .getElementById(
      "unknownProductView"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "scannerArea"
    )
    .classList
    .remove("hidden");

  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode(
          "reader",
          {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A
            ]
          }
        );
    }

    await html5QrCode.start(
      {
        facingMode:
          "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 120
        }
      },
      async decodedText => {

        if (scanLock) {
          return;
        }

        scanLock = true;

        const jan =
          String(decodedText)
            .trim();

        await stopScanner();

        await handleJan(jan);
      },
      () => {}
    );

    scannerRunning = true;

  } catch (err) {

    scannerRunning = false;

    document
      .getElementById(
        "scannerArea"
      )
      .classList
      .add("hidden");

    message(
      "カメラを開始できませんでした。ブラウザのカメラ権限を確認してください。",
      "error"
    );

    console.error(err);
  }
}

async function stopScanner() {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    try {
      await html5QrCode.stop();
    } catch (err) {
      console.log(err);
    }
  }

  scannerRunning = false;

  document
    .getElementById(
      "scannerArea"
    )
    .classList
    .add("hidden");
}

async function handleJan(jan) {

  if (!currentHousehold) {
    return;
  }

  message(
    "JANを確認しています…"
  );

  const {
    data: product,
    error
  } =
    await db
      .from("products")
      .select("*")
      .eq(
        "household_id",
        currentHousehold.id
      )
      .eq(
        "jan",
        jan
      )
      .maybeSingle();

  if (error) {

    scanLock = false;

    return message(
      error.message,
      "error"
    );
  }

  if (product) {

    await putProductInStock(
      product
    );

    scanLock = false;

    return;
  }

  pendingJan = jan;

  document
    .getElementById(
      "scannedJan"
    )
    .textContent =
      jan;

  document
    .getElementById(
      "newProductName"
    )
    .value = "";

  document
    .getElementById(
      "newProductStorage"
    )
    .value =
      "fridge";

  document
    .getElementById(
      "unknownProductView"
    )
    .classList
    .remove("hidden");

  message(
    "初めての商品です。商品名を一度だけ教えてください。"
  );

  document
    .getElementById(
      "newProductName"
    )
    .focus();
}

async function saveNewProduct() {

  if (!pendingJan) {
    return message(
      "JANがありません",
      "error"
    );
  }

  const name =
    document
      .getElementById(
        "newProductName"
      )
      .value
      .trim();

  const storage =
    document
      .getElementById(
        "newProductStorage"
      )
      .value;

  if (!name) {
    return message(
      "商品名を入力してください",
      "error"
    );
  }

  const { data, error } =
    await db
      .from("products")
      .upsert(
        {
          household_id:
            currentHousehold.id,

          jan:
            pendingJan,

          name,

          default_storage:
            storage
        },
        {
          onConflict:
            "household_id,jan"
        }
      )
      .select()
      .single();

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  pendingJan = null;

  document
    .getElementById(
      "unknownProductView"
    )
    .classList
    .add("hidden");

  await putProductInStock(
    data
  );

  scanLock = false;
}

function cancelUnknownProduct() {

  pendingJan = null;
  scanLock = false;

  document
    .getElementById(
      "unknownProductView"
    )
    .classList
    .add("hidden");

  message("");
}

async function putProductInStock(
  product
) {

  const {
    data: existing,
    error: findError
  } =
    await db
      .from("items")
      .select("*")
      .eq(
        "household_id",
        currentHousehold.id
      )
      .eq(
        "jan",
        product.jan
      )
      .maybeSingle();

  if (findError) {
    return message(
      findError.message,
      "error"
    );
  }

  if (existing) {

    const { error } =
      await db
        .from("items")
        .update({
          name:
            product.name,

          storage:
            product.default_storage,

          status:
            "in_stock"
        })
        .eq(
          "id",
          existing.id
        );

    if (error) {
      return message(
        error.message,
        "error"
      );
    }

  } else {

    const { error } =
      await db
        .from("items")
        .insert({
          household_id:
            currentHousehold.id,

          name:
            product.name,

          storage:
            product.default_storage,

          status:
            "in_stock",

          jan:
            product.jan
        });

    if (error) {
      return message(
        error.message,
        "error"
      );
    }
  }

  message(
    "✓ " +
    product.name +
    " を入庫しました",
    "success"
  );

  await loadItems();
}


/* ===============================
   v0.3 レシートOCR
   =============================== */

function receiptFileChanged() {

  const input =
    document.getElementById(
      "receiptFile"
    );

  const preview =
    document.getElementById(
      "receiptPreview"
    );

  document
    .getElementById(
      "ocrResultArea"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "ocrResult"
    )
    .value = "";

  if (receiptPreviewUrl) {

    URL.revokeObjectURL(
      receiptPreviewUrl
    );

    receiptPreviewUrl = null;
  }

  if (
    !input.files ||
    !input.files[0]
  ) {

    preview.classList.add(
      "hidden"
    );

    preview.removeAttribute(
      "src"
    );

    return;
  }

  receiptPreviewUrl =
    URL.createObjectURL(
      input.files[0]
    );

  preview.src =
    receiptPreviewUrl;

  preview.classList.remove(
    "hidden"
  );

  message("");
}

function updateOcrProgress(m) {

  const wrap =
    document.getElementById(
      "ocrProgressWrap"
    );

  const fill =
    document.getElementById(
      "ocrProgressFill"
    );

  const status =
    document.getElementById(
      "ocrStatus"
    );

  wrap.classList.remove(
    "hidden"
  );

  const pct =
    typeof m.progress ===
    "number"
      ? Math.round(
          m.progress * 100
        )
      : 0;

  fill.style.width =
    pct + "%";

  const labels = {

    "loading tesseract core":
      "OCRエンジンを読み込み中",

    "initializing tesseract":
      "OCRエンジンを初期化中",

    "loading language traineddata":
      "日本語データを読み込み中",

    "initializing api":
      "認識準備中",

    "recognizing text":
      "レシートを読み取り中"
  };

  status.textContent =
    (
      labels[m.status] ||
      m.status ||
      "処理中"
    ) +
    (
      typeof m.progress ===
      "number"
        ? ` ${pct}%`
        : ""
    );
}

async function getOcrWorker() {

  if (ocrWorker) {
    return ocrWorker;
  }

  ocrWorker =
    await Tesseract.createWorker(
      [
        "jpn",
        "eng"
      ],
      1,
      {
        logger:
          updateOcrProgress
      }
    );

  return ocrWorker;
}

async function runReceiptOcr() {

  const input =
    document.getElementById(
      "receiptFile"
    );

  const button =
    document.getElementById(
      "ocrButton"
    );

  const resultArea =
    document.getElementById(
      "ocrResultArea"
    );

  const resultBox =
    document.getElementById(
      "ocrResult"
    );

  const fill =
    document.getElementById(
      "ocrProgressFill"
    );

  const status =
    document.getElementById(
      "ocrStatus"
    );

  if (
    !input.files ||
    !input.files[0]
  ) {
    return message(
      "先にレシートを撮影するか、写真を選んでください。",
      "error"
    );
  }

  button.disabled = true;

  button.textContent =
    "読み取り中…";

  resultArea.classList.add(
    "hidden"
  );

  fill.style.width =
    "0%";

  status.textContent =
    "準備中…";

  document
    .getElementById(
      "ocrProgressWrap"
    )
    .classList
    .remove("hidden");

  message(
    "レシートをOCRしています…"
  );

  try {

    const worker =
      await getOcrWorker();

    const {
      data: {
        text
      }
    } =
      await worker.recognize(
        input.files[0]
      );

    resultBox.value =
      (text || "")
        .trim();

    resultArea.classList.remove(
      "hidden"
    );

    fill.style.width =
      "100%";

    status.textContent =
      "完了 100%";

    message(
      "✓ OCRが完了しました。在庫データは変更していません。",
      "success"
    );

  } catch (err) {

    console.error(err);

    message(
      "OCRに失敗しました。別の写真で試すか、画像形式を確認してください。",
      "error"
    );

    status.textContent =
      "OCRエラー";

  } finally {

    button.disabled =
      false;

    button.textContent =
      "文字を読み取る";
  }
}

function clearReceiptOcr() {

  document
    .getElementById(
      "ocrResult"
    )
    .value = "";

  document
    .getElementById(
      "ocrResultArea"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "ocrProgressWrap"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "ocrProgressFill"
    )
    .style.width =
      "0%";

  message("");
}


/* ===============================
   手動追加・在庫
   =============================== */

async function addItem() {

  const name =
    document
      .getElementById(
        "itemName"
      )
      .value
      .trim();

  const storage =
    document
      .getElementById(
        "storage"
      )
      .value;

  if (!name) {
    return message(
      "商品名を入力してください",
      "error"
    );
  }

  const { error } =
    await db
      .from("items")
      .insert({
        household_id:
          currentHousehold.id,

        name,

        storage,

        status:
          "in_stock"
      });

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  document
    .getElementById(
      "itemName"
    )
    .value = "";

  await loadItems();
}

async function loadItems() {

  if (!currentHousehold) {
    return;
  }

  const { data, error } =
    await db
      .from("items")
      .select("*")
      .eq(
        "household_id",
        currentHousehold.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  renderItems(
    data || []
  );
}

function renderItems(items) {

  const stock =
    document.getElementById(
      "items"
    );

  const shopping =
    document.getElementById(
      "shopping"
    );

  stock.innerHTML = "";
  shopping.innerHTML = "";

  const storageNames = {
    fridge: "冷蔵",
    freezer: "冷凍",
    pantry: "常温"
  };

  items.forEach(item => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "item";

    const janBadge =
      item.jan
        ? '<span class="badge">JAN</span>'
        : "";

    div.innerHTML = `
      <div class="item-name">
        ${escapeHtml(item.name)}
        ${janBadge}
      </div>

      <div class="item-meta">
        ${storageNames[item.storage]}
      </div>

      <div class="status-buttons">

        <button
          class="${item.status === "in_stock" ? "active" : ""}"
          onclick="setStatus('${item.id}','in_stock')">
          ある
        </button>

        <button
          class="${item.status === "low" ? "active" : ""}"
          onclick="setStatus('${item.id}','low')">
          少ない
        </button>

        <button
          class="${item.status === "out" ? "active" : ""}"
          onclick="setStatus('${item.id}','out')">
          ない
        </button>

      </div>

      <button
        class="danger"
        onclick="deleteItem('${item.id}')">
        削除
      </button>
    `;

    stock.appendChild(
      div
    );

    if (
      item.status === "out" ||
      item.status === "low"
    ) {

      const shop =
        document.createElement(
          "div"
        );

      shop.className =
        "item";

      shop.textContent =
        item.status === "out"
          ? "🛒 " + item.name
          : "⚠️ " +
            item.name +
            "（少ない）";

      shopping.appendChild(
        shop
      );
    }
  });

  if (!items.length) {

    stock.textContent =
      "まだ食品がありません";
  }

  if (
    !items.some(
      x =>
        x.status === "out" ||
        x.status === "low"
    )
  ) {

    shopping.textContent =
      "買い物候補はありません";
  }
}

async function setStatus(
  id,
  status
) {

  const { error } =
    await db
      .from("items")
      .update({
        status
      })
      .eq(
        "id",
        id
      );

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  await loadItems();
}

async function deleteItem(id) {

  if (
    !confirm(
      "在庫一覧から削除しますか？"
    )
  ) {
    return;
  }

  const { error } =
    await db
      .from("items")
      .delete()
      .eq(
        "id",
        id
      );

  if (error) {
    return message(
      error.message,
      "error"
    );
  }

  await loadItems();
}


/* ===============================
   リアルタイム同期
   =============================== */

function startRealtime() {

  if (realtimeChannel) {

    db.removeChannel(
      realtimeChannel
    );
  }

  realtimeChannel =
    db
      .channel(
        "items-" +
        currentHousehold.id
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "items",
          filter:
            "household_id=eq." +
            currentHousehold.id
        },
        () =>
          loadItems()
      )
      .subscribe();
}


/* ===============================
   認証監視
   =============================== */

db.auth.onAuthStateChange(
  (_event, session) => {

    setTimeout(
      () => {

        if (session) {
          boot();
        }

      },
      0
    );
  }
);

boot();

</script>
</body>
</html>
